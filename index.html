<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>CMS · Marketographers / Estudio Graphica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/quill@1.3.6/dist/quill.snow.css" rel="stylesheet">
<style>
  :root{
    --dark:#181818; --yellow:#FFDD5A; --yellow-hover:#F5D000;
    --off-white:#F8F8F8; --cream:#F0EDE6; --gray:#6B6660;
    --white:#ffffff; --radius:18px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);color:var(--dark);font:15px/1.6 'DM Sans',sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.headline{font-family:'Syne',sans-serif;font-weight:800;letter-spacing:-0.01em;}
  .cursive{font-family:'Playfair Display',serif;font-style:italic;font-weight:700;color:var(--yellow-hover);}
  header{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;background:rgba(255,255,255,0.85);backdrop-filter:blur(14px);border-bottom:1px solid rgba(24,24,24,0.08);position:sticky;top:0;z-index:10;}
  header h1{font-size:16px;margin:0;}
  .wrap{max-width:920px;margin:0 auto;padding:28px;}
  .tabs{display:flex;gap:10px;margin-bottom:22px;}
  .tab{padding:9px 20px;border-radius:9999px;border:1px solid rgba(24,24,24,0.1);background:#fff;color:var(--gray);cursor:pointer;font-size:13.5px;font-weight:600;transition:all .2s;}
  .tab.active{background:var(--yellow);color:var(--dark);border-color:var(--yellow);}
  .card{background:var(--white);border:1px solid rgba(24,24,24,0.06);border-radius:var(--radius);padding:22px;margin-bottom:16px;box-shadow:0 8px 24px rgba(24,24,24,0.05);}
  .post-row{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid rgba(24,24,24,0.06);}
  .post-row:last-child{border-bottom:none;}
  .post-row img{width:72px;height:46px;object-fit:cover;border-radius:8px;flex-shrink:0;background:#eee;}
  .post-row .info{flex:1;min-width:0;}
  .post-row .info b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;}
  .post-row .info span{color:var(--gray);font-size:12px;}
  .post-row .actions{display:flex;gap:6px;}
  button{font:inherit;cursor:pointer;border-radius:9999px;border:1px solid rgba(24,24,24,0.12);background:#fff;color:var(--dark);padding:8px 16px;font-weight:600;font-size:13.5px;transition:all .15s;}
  button:hover{border-color:rgba(24,24,24,0.25);}
  button.primary{background:var(--yellow);border-color:var(--yellow);color:var(--dark);}
  button.primary:hover{background:var(--yellow-hover);border-color:var(--yellow-hover);}
  button.danger{background:transparent;border-color:#e0b3ab;color:#b3402f;}
  button.ghost{background:transparent;border-color:transparent;color:var(--gray);}
  button:disabled{opacity:.5;cursor:default;}
  button.block-btn{font-size:12px;padding:6px 12px;background:var(--off-white);}
  input,textarea,select{width:100%;background:var(--off-white);border:1px solid rgba(24,24,24,0.1);color:var(--dark);border-radius:10px;padding:10px 12px;font:inherit;margin-top:4px;}
  input:focus,textarea:focus{outline:none;border-color:var(--yellow-hover);}
  label{display:block;margin-bottom:14px;font-size:13px;color:var(--gray);font-weight:600;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .row3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px;}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
  .banner{padding:12px 16px;border-radius:12px;margin-bottom:14px;font-size:14px;}
  .banner.ok{background:#eaf7ea;color:#256829;border:1px solid #bfe3c0;}
  .banner.err{background:#fbeaea;color:#a3382b;border:1px solid #f0c4bd;}
  .hint{color:var(--gray);font-size:12px;margin-top:4px;}
  a{color:var(--yellow-hover);}
  .login-box{max-width:340px;margin:100px auto;text-align:center;}
  #app{display:none;}
  .blocks-row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px;}
  #editor{background:#fff;border-radius:0 0 10px 10px;min-height:260px;font-size:15px;}
  .ql-toolbar{border-radius:10px 10px 0 0;background:var(--off-white);}
  .editor-tabs{display:flex;gap:6px;margin-bottom:0;}
  .editor-tab{padding:6px 14px;border-radius:9999px 9999px 0 0;border:1px solid rgba(24,24,24,0.1);border-bottom:none;background:var(--off-white);color:var(--gray);font-size:12.5px;cursor:pointer;}
  .editor-tab.active{background:#fff;color:var(--dark);font-weight:700;}
  #previewFrame{width:100%;height:600px;border:1px solid rgba(24,24,24,0.1);border-radius:10px;background:#fff;display:none;}
</style>
</head>
<body>

<div id="login" class="login-box">
  <h2>Panel de contenido</h2>
  <p class="hint">Marketographers / Estudio Graphica</p>
  <label>Contraseña
    <input type="password" id="pw" autofocus>
  </label>
  <button class="primary" style="width:100%" onclick="login()">Entrar</button>
  <p id="loginError" class="hint" style="color:#b3402f"></p>
</div>

<div id="app">
  <header>
    <h1>CMS de contenido</h1>
    <button class="ghost" onclick="logout()">Salir</button>
  </header>
  <div class="wrap">
    <div class="tabs">
      <div class="tab" data-site="mkt" onclick="switchSite('mkt')">The Marketographers</div>
      <div class="tab" data-site="eg" onclick="switchSite('eg')">Estudio Graphica</div>
    </div>

    <div id="banner"></div>

    <div id="listView">
      <div class="toolbar">
        <span class="hint" id="siteLabel"></span>
        <button class="primary" onclick="openForm()">+ Nuevo post</button>
      </div>
      <div class="card" id="postList">Cargando…</div>
    </div>

    <div id="formView" style="display:none">
      <div class="toolbar">
        <span class="hint" id="formTitle">Nuevo post</span>
        <button class="ghost" onclick="closeForm()">← Volver al listado</button>
      </div>
      <div class="card">
        <label>Título
          <input id="f_title" oninput="onTitleInput()">
        </label>
        <div class="row2">
          <label>Slug (URL)
            <input id="f_slug">
            <span class="hint">Solo minúsculas, números y guiones. Se genera solo desde el título.</span>
          </label>
          <label>Categoría / etiqueta
            <input id="f_category" placeholder="Ej: Precio y ventas">
          </label>
        </div>
        <div class="row3">
          <label>Fecha
            <input id="f_date" type="date">
          </label>
          <label>Min. de lectura
            <input id="f_reading" type="number" min="1">
          </label>
          <label>Slug bloqueado al editar
            <input id="f_locked" disabled value="Sí (editar contenido, no la URL)">
          </label>
        </div>
        <label>Descripción SEO (150-160 caracteres, aparece en Google y al compartir)
          <textarea id="f_meta" style="min-height:60px"></textarea>
        </label>
        <div class="row2">
          <label>URL imagen de portada (Cloudinary)
            <input id="f_img">
          </label>
          <label>Texto alternativo de la imagen
            <input id="f_alt">
          </label>
        </div>
        <label>Resumen corto (aparece en la tarjeta del listado del blog)
          <textarea id="f_excerpt" style="min-height:50px"></textarea>
        </label>

        <label style="margin-bottom:6px">Contenido del artículo</label>
        <div class="editor-tabs">
          <div class="editor-tab active" id="tabEdit" onclick="showEditTab()">Editar</div>
          <div class="editor-tab" id="tabPreview" onclick="showPreviewTab()">Vista previa con el diseño real</div>
        </div>
        <div id="editorWrap">
          <div id="editor"></div>
          <div class="blocks-row" id="blocksRow"></div>
        </div>
        <iframe id="previewFrame"></iframe>

        <div id="mktOnlyFields" style="margin-top:16px">
          <div class="row2">
            <label>Título del CTA final (opcional)
              <input id="f_ctaTitle" placeholder="¿Quieres dejar de competir por precio?">
            </label>
            <label>Texto del CTA final (opcional)
              <input id="f_ctaText" placeholder="Entra a la comunidad...">
            </label>
          </div>
        </div>
        <div class="toolbar" style="margin-top:10px">
          <span></span>
          <button class="primary" id="saveBtn" onclick="savePost()">Publicar</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/quill@1.3.6/dist/quill.js"></script>
<script>
const SITES = {
  mkt: {
    label: 'The Marketographers',
    stylesheets: [
      'https://marketographers.com/assets/global.css',
      'https://marketographers.com/blog/assets/blog-extra.css',
    ],
    fontsHref: 'https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap',
    previewWrapOpen: '<div class="article-body"><div class="wrap-article">',
    previewWrapClose: '</div></div>',
    previewBg: '#faf9f6',
    blocks: [],
  },
  eg: {
    label: 'Estudio Graphica',
    stylesheets: [ 'https://estudiographica.com/blog/assets/style.css' ],
    fontsHref: 'https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300&family=Playfair+Display:ital,wght@1,700&family=Syne:wght@700;800&display=swap',
    previewWrapOpen: '<article>',
    previewWrapClose: '</article>',
    previewBg: '#F0EDE6',
    blocks: [
      { label: '+ Bloque de error', html: '<div class="error-card"><p class="error-num">Error 1</p><div class="error-title">Título del error</div><p class="error-body">Explicación del error.</p></div><p><br></p>' },
      { label: '+ FAQ', html: '<div class="faq"><div class="faq-item"><p class="faq-q">¿Pregunta frecuente?</p><p class="faq-a">Respuesta.</p></div></div><p><br></p>' },
      { label: '+ Callout con botón', html: '<div class="callout"><p>Texto con <span class="cursive">acento dorado</span> antes del botón.</p><a class="btn" href="/precios">Ver planes y precios →</a></div><p><br></p>' },
      { label: '+ Tarjeta de ranking', html: '<div class="rank-card"><div class="rank-num">1</div><div class="rank-title">Título del ítem</div><p class="rank-desc">Descripción breve.</p></div><p><br></p>' },
    ],
  },
};
let currentSite = 'mkt';
let editingSlug = null;
let cachedPosts = [];
let quill = null;

function pw(){ return sessionStorage.getItem('cms_pw') || ''; }

async function api(path, opts = {}) {
  const res = await fetch('/.netlify/functions/' + path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', 'x-admin-password': pw(), ...(opts.headers||{}) },
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('Error ' + res.status));
  return data;
}

function login() {
  const val = document.getElementById('pw').value;
  sessionStorage.setItem('cms_pw', val);
  document.getElementById('loginError').textContent = '';
  boot();
}
function logout(){ sessionStorage.removeItem('cms_pw'); location.reload(); }

async function boot() {
  try {
    await api('list-posts?site=mkt');
    document.getElementById('login').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    initQuill();
    switchSite('mkt');
  } catch (e) {
    document.getElementById('loginError').textContent = 'Contraseña incorrecta o falta configurar el servidor.';
  }
}

function initQuill() {
  quill = new Quill('#editor', {
    theme: 'snow',
    modules: {
      toolbar: [
        [{ header: [2, 3, false] }],
        ['bold', 'italic'],
        ['blockquote', 'link'],
        [{ list: 'ordered' }, { list: 'bullet' }],
        ['clean'],
      ],
    },
  });
}

function renderBlocksRow() {
  const blocks = SITES[currentSite].blocks;
  const row = document.getElementById('blocksRow');
  if (!blocks.length) { row.innerHTML = ''; return; }
  row.innerHTML = blocks.map((b, i) => `<button type="button" class="block-btn" onclick="insertBlock(${i})">${b.label}</button>`).join('');
}
function insertBlock(i) {
  const block = SITES[currentSite].blocks[i];
  const range = quill.getSelection(true) || { index: quill.getLength() };
  quill.clipboard.dangerouslyPasteHTML(range.index, block.html, 'user');
}

function showEditTab() {
  document.getElementById('tabEdit').classList.add('active');
  document.getElementById('tabPreview').classList.remove('active');
  document.getElementById('editorWrap').style.display = 'block';
  document.getElementById('previewFrame').style.display = 'none';
}
function showPreviewTab() {
  document.getElementById('tabEdit').classList.remove('active');
  document.getElementById('tabPreview').classList.add('active');
  document.getElementById('editorWrap').style.display = 'none';
  const frame = document.getElementById('previewFrame');
  frame.style.display = 'block';
  const site = SITES[currentSite];
  const bodyHtml = quill.root.innerHTML;
  const links = site.stylesheets.map(h => `<link rel="stylesheet" href="${h}">`).join('\n');
  const doc = `<!doctype html><html><head><meta charset="utf-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="${site.fontsHref}" rel="stylesheet">
    ${links}
    <style>body{background:${site.previewBg};padding:24px;}</style>
    </head><body>${site.previewWrapOpen}${bodyHtml}${site.previewWrapClose}</body></html>`;
  frame.srcdoc = doc;
}

function switchSite(site) {
  currentSite = site;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.site === site));
  document.getElementById('siteLabel').textContent = SITES[site].label;
  document.getElementById('mktOnlyFields').style.display = site === 'mkt' ? 'block' : 'none';
  renderBlocksRow();
  closeForm();
  loadPosts();
}

function banner(msg, ok) {
  document.getElementById('banner').innerHTML = `<div class="banner ${ok ? 'ok' : 'err'}">${msg}</div>`;
}

async function loadPosts() {
  const list = document.getElementById('postList');
  list.textContent = 'Cargando…';
  try {
    const { posts } = await api('list-posts?site=' + currentSite);
    cachedPosts = posts;
    if (!posts.length) { list.textContent = 'Todavía no hay posts.'; return; }
    list.innerHTML = posts.map(p => `
      <div class="post-row">
        <img src="${p.coverImageUrl}" onerror="this.style.visibility='hidden'">
        <div class="info">
          <b>${p.title}</b>
          <span>${p.category || ''} · /blog/${p.slug}/</span>
        </div>
        <div class="actions">
          <button onclick="editPost('${p.slug}')">Editar</button>
          <button class="danger" onclick="deletePost('${p.slug}', this)">Despublicar</button>
        </div>
      </div>
    `).join('');
  } catch (e) {
    list.textContent = 'Error cargando posts: ' + e.message;
  }
}

function slugify(text) {
  return text.toString().toLowerCase().trim()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9\s-]/g, '')
    .replace(/\s+/g, '-')
    .replace(/-+/g, '-')
    .replace(/^-|-$/g, '');
}
function onTitleInput() {
  if (editingSlug) return;
  document.getElementById('f_slug').value = slugify(document.getElementById('f_title').value);
}

function clearForm() {
  ['f_title','f_slug','f_category','f_date','f_reading','f_meta','f_img','f_alt','f_excerpt','f_ctaTitle','f_ctaText']
    .forEach(id => document.getElementById(id).value = '');
  document.getElementById('f_date').value = new Date().toISOString().slice(0,10);
  document.getElementById('f_reading').value = 5;
  quill.setText('');
  showEditTab();
}

function openForm() {
  editingSlug = null;
  clearForm();
  document.getElementById('f_slug').disabled = false;
  document.getElementById('formTitle').textContent = 'Nuevo post · ' + SITES[currentSite].label;
  document.getElementById('saveBtn').textContent = 'Publicar';
  document.getElementById('listView').style.display = 'none';
  document.getElementById('formView').style.display = 'block';
}

function closeForm() {
  document.getElementById('formView').style.display = 'none';
  document.getElementById('listView').style.display = 'block';
}

async function editPost(slug) {
  try {
    const data = await api('get-post?site=' + currentSite + '&slug=' + encodeURIComponent(slug));
    const cardData = cachedPosts.find(p => p.slug === slug) || {};
    editingSlug = slug;
    clearForm();
    document.getElementById('f_title').value = data.title || '';
    document.getElementById('f_slug').value = slug;
    document.getElementById('f_slug').disabled = true;
    document.getElementById('f_category').value = data.category || '';
    document.getElementById('f_date').value = data.date || '';
    document.getElementById('f_reading').value = data.readingMinutes || 5;
    document.getElementById('f_meta').value = data.metaDescription || '';
    document.getElementById('f_img').value = data.coverImageUrl || '';
    document.getElementById('f_alt').value = data.coverImageAlt || '';
    document.getElementById('f_excerpt').value = cardData.excerpt || '';
    quill.clipboard.dangerouslyPasteHTML(data.bodyHtml || '');
    document.getElementById('formTitle').textContent = 'Editando · ' + data.title;
    document.getElementById('saveBtn').textContent = 'Guardar cambios';
    document.getElementById('listView').style.display = 'none';
    document.getElementById('formView').style.display = 'block';
  } catch (e) {
    banner('No se pudo cargar el post: ' + e.message, false);
  }
}

async function savePost() {
  const post = {
    site: currentSite,
    isEdit: !!editingSlug,
    slug: document.getElementById('f_slug').value.trim(),
    title: document.getElementById('f_title').value.trim(),
    category: document.getElementById('f_category').value.trim(),
    date: document.getElementById('f_date').value,
    readingMinutes: document.getElementById('f_reading').value,
    metaDescription: document.getElementById('f_meta').value.trim(),
    coverImageUrl: document.getElementById('f_img').value.trim(),
    coverImageAlt: document.getElementById('f_alt').value.trim(),
    excerpt: document.getElementById('f_excerpt').value.trim(),
    bodyHtml: quill.root.innerHTML,
    ctaTitle: document.getElementById('f_ctaTitle').value.trim(),
    ctaText: document.getElementById('f_ctaText').value.trim(),
  };
  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  btn.textContent = 'Publicando…';
  try {
    const res = await api('save-post', { method: 'POST', body: JSON.stringify(post) });
    banner(`Listo. Publicado en <a href="${res.url}" target="_blank">${res.url}</a> · <a href="${res.commitUrl}" target="_blank">ver commit</a>`, true);
    closeForm();
    loadPosts();
  } catch (e) {
    banner('Error al publicar: ' + e.message, false);
  } finally {
    btn.disabled = false;
    btn.textContent = editingSlug ? 'Guardar cambios' : 'Publicar';
  }
}

async function deletePost(slug, btn) {
  if (!confirm('¿Despublicar "' + slug + '"? Esto borra el post del sitio.')) return;
  btn.disabled = true;
  try {
    await api('delete-post', { method: 'POST', body: JSON.stringify({ site: currentSite, slug }) });
    banner('Post despublicado.', true);
    loadPosts();
  } catch (e) {
    banner('Error al despublicar: ' + e.message, false);
    btn.disabled = false;
  }
}

if (pw()) boot();
</script>

</body>
</html>
